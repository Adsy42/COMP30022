name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/cd]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

# Ensure CI fails if any job fails
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "./backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: black --check .

      - name: Lint check
        run: ruff check .

  ai-service:
    name: AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "./ai-service/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: black --check .

      - name: Lint check
        run: ruff check .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    needs:
      - frontend
      - backend
      - ai-service
    if: github.ref == 'refs/heads/main'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Railway Secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Error: RAILWAY_TOKEN secret is not set"
            echo "Please set RAILWAY_TOKEN in GitHub repository secrets"
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Error: RAILWAY_PROJECT_ID secret is not set"
            echo "Please set RAILWAY_PROJECT_ID in GitHub repository secrets"
            echo "Find your project ID in Railway dashboard URL or project settings"
            exit 1
          fi
          echo "✓ Railway secrets are configured"
          echo "  - Token length: ${#RAILWAY_TOKEN}"
          echo "  - Project ID: $RAILWAY_PROJECT_ID"

      - name: Deploy Frontend
        run: |
          echo "🚀 Deploying Frontend service to project $RAILWAY_PROJECT_ID..."
          railway up --service=frontend --detach --project=$RAILWAY_PROJECT_ID

      - name: Deploy Backend
        run: |
          echo "🚀 Deploying Backend service to project $RAILWAY_PROJECT_ID..."
          railway up --service=backend --detach --project=$RAILWAY_PROJECT_ID

      - name: Deploy AI Service
        run: |
          echo "🚀 Deploying AI Service to project $RAILWAY_PROJECT_ID..."
          railway up --service=ai-service --detach --project=$RAILWAY_PROJECT_ID
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # needs:
    #   - frontend
    #   - backend
    #   - ai-service
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/cd'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link Railway Project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Error: RAILWAY_TOKEN secret is not set"
            echo "Please set RAILWAY_TOKEN in GitHub repository secrets"
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Error: RAILWAY_PROJECT_ID secret is not set"
            echo "Please set RAILWAY_PROJECT_ID in GitHub repository secrets"
            exit 1
          fi
          railway link --project $RAILWAY_PROJECT_ID

      - name: Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --detach

      - name: Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

      - name: Deploy AI Service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ai-service --detach
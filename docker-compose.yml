version: "3.8"

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: legal-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: legal_ai
    volumes:
      - mongo_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - legal-ai-network

  # Backend Flask API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-ai-backend
    restart: unless-stopped
    ports:
      - "5050:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - ai-service
    volumes:
      - ./backend:/app
      - ./database:/database
    networks:
      - legal-ai-network

  # AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: legal-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      - ./ai-service:/app
      - ./ai-service/data:/app/data
    networks:
      - legal-ai-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5050  # For browser
      INTERNAL_API_URL: http://backend:5050        # For server-side
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - legal-ai-network

networks:
  legal-ai-network:
    driver: bridge

volumes:
  mongo_data: